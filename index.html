<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>华夏文明 · 秦汉至明清</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #181c19;
      --paper: #f4eee3;
      --paper-deep: #e8ddce;
      --gold: #c99a5c;
      --gold-light: #e7c789;
      --cream: #f6efdf;
      --muted: rgba(246,239,223,.68);
      --line: rgba(255,255,255,.18);
      --panel: rgba(24,29,25,.96);
      --ink: #2c2821;
      --danger: #9d574a;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      color: var(--cream);
      background: var(--bg);
      font-family:
        "Noto Serif SC",
        "Songti SC",
        "STSong",
        "Microsoft YaHei",
        serif;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    img,
    video {
      max-width: 100%;
    }

    .app {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .world {
      width: 100%;
      height: 100%;
      transition: transform .72s cubic-bezier(.76, 0, .24, 1);
    }

    .hall {
      --mx: 0px;
      --my: 0px;
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 650px;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(
          circle at 73% 24%,
          rgba(206,157,85,.24),
          transparent 29%
        ),
        linear-gradient(135deg, #3c493c, #1d251f 76%);
    }

    .hall[data-dynasty="qinhan"] {
      background:
        radial-gradient(
          circle at 73% 24%,
          rgba(211,144,66,.25),
          transparent 29%
        ),
        linear-gradient(135deg, #493323, #211a15 76%);
    }

    .hall[data-dynasty="tangsong"] {
      background:
        radial-gradient(
          circle at 73% 24%,
          rgba(76,159,167,.23),
          transparent 29%
        ),
        linear-gradient(135deg, #2f4b4e, #1c2829 76%);
    }

    .hall[data-dynasty="mingqing"] {
      background:
        radial-gradient(
          circle at 73% 24%,
          rgba(115,164,114,.23),
          transparent 29%
        ),
        linear-gradient(135deg, #354936, #1d271f 76%);
    }

    .hall::before {
      position: absolute;
      inset: 0;
      z-index: -2;
      content: "";
      opacity: .35;
      background:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 62px 62px;
      mask-image: linear-gradient(to bottom, black, transparent 90%);
    }

    .hall::after {
      position: absolute;
      inset: -10%;
      z-index: -3;
      content: "";
      pointer-events: none;
      background:
        radial-gradient(
          ellipse at center,
          rgba(238,194,119,.15),
          transparent 60%
        );
      transform: translate3d(var(--mx), var(--my), 0);
      transition: transform .2s ease-out;
    }

    .topbar {
      position: absolute;
      top: 24px;
      right: 32px;
      left: 32px;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .museum-title {
      display: flex;
      align-items: center;
      gap: 12px;
      color: rgba(255,255,255,.86);
      font-size: 13px;
      letter-spacing: .12em;
    }

    .seal {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      color: #2d2114;
      background: var(--gold-light);
      border-radius: 50%;
      font-size: 15px;
      font-weight: 700;
    }

    .counter {
      padding: 8px 12px;
      color: rgba(255,255,255,.72);
      background: rgba(0,0,0,.25);
      border: 1px solid var(--line);
      border-radius: 3px;
      font-family: system-ui, sans-serif;
      font-size: 11px;
      letter-spacing: .15em;
    }

    .hall-copy {
      position: absolute;
      top: 16%;
      left: 8%;
      z-index: 10;
      width: min(425px, 37%);
      pointer-events: none;
      transform: translate3d(var(--mx), var(--my), 0);
      transition: transform .2s ease-out;
    }

    .hall-index {
      display: block;
      margin-bottom: 16px;
      color: var(--gold-light);
      font-family: system-ui, sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .2em;
    }

    .hall-copy h1 {
      margin: 0 0 16px;
      color: var(--cream);
      font-size: clamp(42px, 5.8vw, 84px);
      font-weight: 500;
      line-height: 1.05;
      letter-spacing: .08em;
      text-shadow: 0 5px 28px rgba(0,0,0,.35);
    }

    .hall-copy h2 {
      margin: 0 0 18px;
      color: var(--gold-light);
      font-size: clamp(16px, 1.7vw, 24px);
      font-weight: 500;
      letter-spacing: .08em;
    }

    .hall-copy p {
      max-width: 380px;
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 2;
    }

    .gold-line {
      width: 72px;
      height: 2px;
      margin-top: 24px;
      background: var(--gold-light);
      box-shadow: 0 0 18px rgba(231,199,137,.42);
    }

    .artifact-zone {
      position: absolute;
      top: 12%;
      right: 7%;
      bottom: 6%;
      width: 53%;
      min-width: 430px;
      transform: translate3d(
        calc(var(--mx) * -.42),
        calc(var(--my) * -.42),
        0
      );
      transition: transform .2s ease-out;
    }

    .artifact-glow {
      position: absolute;
      top: -5%;
      right: 10%;
      width: 75%;
      height: 95%;
      opacity: .58;
      background:
        radial-gradient(
          ellipse,
          rgba(239,200,132,.42),
          transparent 68%
        );
      filter: blur(28px);
    }

    .artifact-stage {
      position: absolute;
      inset: 8% 4% 0;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1250px;
    }

    .artifact-frame {
      position: relative;
      width: min(680px, 94%);
      padding: 17px;
      background: linear-gradient(145deg, #e0bf88, #8b653b);
      border: 1px solid rgba(255,255,255,.28);
      box-shadow:
        0 30px 80px rgba(0,0,0,.46),
        0 0 0 11px rgba(0,0,0,.34),
        0 0 0 12px rgba(207,163,94,.34);
      transform: rotateY(-7deg) rotateX(2deg);
      transition: transform .32s ease;
    }

    .artifact-frame:hover {
      transform: rotateY(-1deg) rotateX(0) translateY(-6px);
    }

    .media-box {
      position: relative;
      width: 100%;
      min-height: 360px;
      overflow: hidden;
      background: #111412;
      border: 1px solid rgba(0,0,0,.44);
    }

    .media-stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 360px;
      background: #111412;
    }

    .media-stage img,
    .media-stage video {
      display: block;
      width: 100%;
      height: min(52vh, 570px);
      object-fit: contain;
      background: #111412;
    }

    .media-stage video {
      object-fit: contain;
    }

    .media-tools {
      position: absolute;
      top: 13px;
      right: 13px;
      z-index: 15;
      display: flex;
      gap: 8px;
    }

    .tool {
      display: grid;
      place-items: center;
      width: 37px;
      height: 37px;
      padding: 0;
      color: #fff;
      background: rgba(0,0,0,.6);
      border: 1px solid rgba(255,255,255,.3);
      border-radius: 50%;
      font-family: system-ui, sans-serif;
      font-size: 15px;
      transition: .2s ease;
    }

    .tool:hover {
      color: #2c2113;
      background: var(--gold-light);
      transform: translateY(-2px);
    }

    .artifact-caption {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 5px 0;
      color: #2b2117;
    }

    .artifact-caption strong {
      display: block;
      margin-bottom: 4px;
      font-size: 17px;
      font-weight: 500;
    }

    .artifact-caption small {
      color: rgba(43,33,23,.66);
      font-family: system-ui, sans-serif;
      font-size: 10px;
    }

    .media-count {
      color: rgba(43,33,23,.68);
      font-family: system-ui, sans-serif;
      font-size: 10px;
    }

    .media-strip {
      display: flex;
      gap: 7px;
      max-width: 100%;
      padding: 11px 4px 1px;
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .media-thumb {
      position: relative;
      flex: 0 0 58px;
      width: 58px;
      height: 42px;
      padding: 0;
      overflow: hidden;
      background: #252923;
      border: 1px solid rgba(45,33,23,.38);
      border-radius: 2px;
      opacity: .65;
      transition: .2s ease;
    }

    .media-thumb.active,
    .media-thumb:hover {
      border-color: #53391f;
      opacity: 1;
      transform: translateY(-2px);
    }

    .media-thumb img,
    .media-thumb video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .media-thumb span {
      position: absolute;
      right: 3px;
      bottom: 3px;
      padding: 2px 3px;
      color: #fff;
      background: rgba(0,0,0,.65);
      font-family: system-ui, sans-serif;
      font-size: 8px;
    }

    .hotspot,
    .viewer-hotspot {
      position: absolute;
      z-index: 20;
      width: 26px;
      height: 26px;
      padding: 0;
      color: transparent;
      background: var(--gold-light);
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 0 6px rgba(225,189,126,.22);
      transform: translate(-50%, -50%);
      animation: pulse 2.2s infinite;
    }

    .hotspot:hover,
    .viewer-hotspot:hover {
      animation: none;
      color: #2d2113;
      background: #fff2ce;
    }

    @keyframes pulse {
      0%, 100% {
        box-shadow: 0 0 0 5px rgba(225,189,126,.2);
      }

      50% {
        box-shadow: 0 0 0 12px rgba(225,189,126,0);
      }
    }

    .hall-help {
      position: absolute;
      bottom: 25px;
      left: 8%;
      z-index: 8;
      color: rgba(255,255,255,.55);
      font-family: system-ui, sans-serif;
      font-size: 11px;
    }

    .side-nav {
      position: fixed;
      top: 50%;
      right: 28px;
      z-index: 35;
      display: grid;
      gap: 14px;
      transform: translateY(-50%);
    }

    .nav-dot {
      position: relative;
      width: 10px;
      height: 10px;
      padding: 0;
      background: rgba(255,255,255,.32);
      border: 0;
      border-radius: 50%;
      transition: .2s ease;
    }

    .nav-dot:hover,
    .nav-dot.active {
      background: var(--gold-light);
      box-shadow: 0 0 0 6px rgba(225,189,126,.18);
    }

    .nav-dot span {
      position: absolute;
      right: 22px;
      width: max-content;
      color: #fff;
      font-family: system-ui, sans-serif;
      font-size: 11px;
      opacity: 0;
      transform: translateX(6px);
      transition: .2s ease;
      pointer-events: none;
    }

    .nav-dot:hover span {
      opacity: 1;
      transform: translateX(0);
    }

    .detail-panel {
      position: fixed;
      right: 34px;
      bottom: 34px;
      z-index: 50;
      width: min(455px, calc(100% - 40px));
      min-height: 205px;
      padding: 28px 30px;
      color: #fff;
      background: var(--panel);
      border: 1px solid rgba(225,189,126,.72);
      border-radius: 4px;
      box-shadow: 0 25px 72px rgba(0,0,0,.38);
      backdrop-filter: blur(14px);
      opacity: 0;
      pointer-events: none;
      transform: translateY(14px) scale(.97);
      transition: .25s ease;
    }

    .detail-panel.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    .detail-panel small {
      display: block;
      margin-bottom: 10px;
      color: var(--gold-light);
      font-family: system-ui, sans-serif;
      font-size: 10px;
      letter-spacing: .16em;
    }

    .detail-panel h3 {
      margin: 0 0 12px;
      font-size: 25px;
      font-weight: 500;
    }

    .detail-panel p {
      margin: 0;
      color: rgba(255,255,255,.76);
      font-size: 15px;
      line-height: 2;
    }

    .close-button {
      position: absolute;
      top: 9px;
      right: 10px;
      width: 28px;
      height: 28px;
      padding: 0;
      color: rgba(255,255,255,.72);
      background: transparent;
      border: 0;
      font-family: system-ui, sans-serif;
      font-size: 20px;
    }

    .edit-toggle {
      position: fixed;
      right: 20px;
      bottom: 18px;
      z-index: 60;
      padding: 9px 13px;
      color: rgba(255,255,255,.82);
      background: rgba(0,0,0,.44);
      border: 1px solid rgba(255,255,255,.26);
      border-radius: 3px;
      font-family: system-ui, sans-serif;
      font-size: 11px;
      backdrop-filter: blur(8px);
    }

    .music-toggle {
      position: fixed;
      right: 20px;
      bottom: 61px;
      z-index: 60;
      padding: 8px 11px;
      color: rgba(255,255,255,.78);
      background: rgba(0,0,0,.35);
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 3px;
      font-family: system-ui, sans-serif;
      font-size: 11px;
    }

    .music-toggle.active {
      color: #2b2113;
      background: var(--gold-light);
    }

    .editor {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      z-index: 90;
      width: min(450px, 100%);
      padding: 26px 22px;
      overflow-y: auto;
      color: var(--ink);
      background: var(--paper);
      box-shadow: -20px 0 70px rgba(0,0,0,.3);
      transform: translateX(100%);
      transition: transform .35s ease;
    }

    .editor.open {
      transform: translateX(0);
    }

    .editor h2 {
      margin: 0 0 7px;
      font-size: 25px;
      font-weight: 500;
    }

    .editor-intro {
      margin: 0 0 22px;
      color: #7b7368;
      font-size: 12px;
      line-height: 1.8;
    }

    .editor-close {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 32px;
      height: 32px;
      padding: 0;
      color: #776f64;
      background: transparent;
      border: 0;
      font-size: 21px;
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      color: #81786d;
      font-size: 11px;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      padding: 10px;
      color: var(--ink);
      background: #fff;
      border: 1px solid #d8cec0;
      border-radius: 3px;
      outline: none;
    }

    .field textarea {
      min-height: 82px;
      resize: vertical;
    }

    .media-editor {
      margin-top: 18px;
      padding-top: 17px;
      border-top: 1px solid #d8cec0;
    }

    .media-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .media-head strong {
      font-size: 13px;
    }

    .small-button {
      padding: 6px 8px;
      color: #765234;
      background: #f7ead9;
      border: 1px solid #d7b184;
      border-radius: 3px;
      font-size: 11px;
    }

    .small-button.danger {
      color: var(--danger);
    }

    .editor-preview {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 160px;
      overflow: hidden;
      background: #e4ddd2;
      border: 1px dashed #cdbda7;
    }

    .editor-preview > img,
    .editor-preview > video {
      display: block;
      width: 100%;
      height: 160px;
      object-fit: contain;
      background: #171817;
    }

    .edit-media-stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 160px;
      background: #171817;
      touch-action: none;
    }

    .edit-media-stage > img {
      display: block;
      width: 100%;
      height: 160px;
      object-fit: contain;
      user-select: none;
    }

    .edit-hotspot-layer {
      position: absolute;
      inset: 0;
    }

    .edit-hotspot {
      position: absolute;
      width: 25px;
      height: 25px;
      padding: 0;
      color: #2d2113;
      background: var(--gold-light);
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 0 5px rgba(225,189,126,.24);
      transform: translate(-50%, -50%);
      cursor: grab;
      touch-action: none;
    }

    .edit-hotspot:active {
      cursor: grabbing;
    }

    .hotspot-list {
      display: grid;
      gap: 9px;
      margin-top: 11px;
    }

    .hotspot-row {
      padding: 10px;
      background: #ebe3d7;
      border: 1px solid #d7cabb;
      border-radius: 3px;
    }

    .hotspot-row input,
    .hotspot-row textarea {
      width: 100%;
      margin-bottom: 6px;
      padding: 7px;
      color: var(--ink);
      background: #fff;
      border: 1px solid #d6cabc;
      border-radius: 3px;
      font-size: 11px;
    }

    .hotspot-row textarea {
      min-height: 55px;
      resize: vertical;
    }

    .coordinate-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .editor-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 18px;
    }

    .editor-button {
      min-height: 40px;
      padding: 9px;
      color: var(--ink);
      background: #fff;
      border: 1px solid #d8cec0;
      border-radius: 3px;
    }

    .editor-button.primary {
      color: #fff;
      background: #a96e3c;
      border-color: #a96e3c;
    }

    .editor-tip {
      margin-top: 15px;
      padding: 11px;
      color: #776f64;
      background: #e9e0d4;
      border-left: 3px solid var(--gold);
      font-size: 11px;
      line-height: 1.8;
    }

    .viewer {
      position: fixed;
      inset: 0;
      z-index: 120;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 24px;
      align-items: center;
      padding: 40px;
      background: rgba(7,9,8,.97);
      opacity: 0;
      pointer-events: none;
      transition: opacity .24s ease;
    }

    .viewer.show {
      opacity: 1;
      pointer-events: auto;
    }

    .viewer-content {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      height: min(86vh, 900px);
      overflow: hidden;
    }

    .viewer-media-stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: 100%;
      max-height: 100%;
      background: #050605;
    }

    .viewer-media-stage img,
    .viewer-media-stage video {
      display: block;
      width: auto;
      max-width: 100%;
      height: auto;
      max-height: 86vh;
      object-fit: contain;
      background: #050605;
      box-shadow: 0 30px 90px rgba(0,0,0,.46);
    }

    .viewer-media-stage video {
      width: min(1000px, 100%);
    }

    .viewer-detail {
      position: relative;
      min-height: 245px;
      padding: 27px;
      color: #fff;
      background: rgba(28,34,29,.96);
      border: 1px solid rgba(225,189,126,.7);
      border-radius: 4px;
      box-shadow: 0 25px 70px rgba(0,0,0,.25);
    }

    .viewer-detail small {
      color: var(--gold-light);
      font-family: system-ui, sans-serif;
      font-size: 10px;
      letter-spacing: .16em;
    }

    .viewer-detail h3 {
      margin: 15px 0 12px;
      font-size: 26px;
      font-weight: 500;
    }

    .viewer-detail p {
      color: rgba(255,255,255,.75);
      font-size: 14px;
      line-height: 2;
    }

    .viewer-close {
      position: absolute;
      top: 18px;
      right: 21px;
      z-index: 30;
      width: 40px;
      height: 40px;
      padding: 0;
      color: #fff;
      background: rgba(0,0,0,.42);
      border: 1px solid rgba(255,255,255,.3);
      border-radius: 50%;
      font-family: system-ui, sans-serif;
      font-size: 23px;
    }

    .viewer-fullscreen {
      position: absolute;
      right: 22px;
      bottom: 20px;
      z-index: 30;
      padding: 9px 12px;
      color: #fff;
      background: rgba(0,0,0,.48);
      border: 1px solid rgba(255,255,255,.3);
      border-radius: 3px;
      font-size: 11px;
    }

    .viewer-arrow {
      position: absolute;
      top: 50%;
      z-index: 30;
      display: grid;
      place-items: center;
      width: 58px;
      height: 92px;
      padding: 0;
      color: rgba(255,255,255,.88);
      background: rgba(18,23,19,.64);
      border: 1px solid rgba(231,199,137,.52);
      border-radius: 4px;
      box-shadow: 0 12px 35px rgba(0,0,0,.24);
      transform: translateY(-50%);
      transition: .2s ease;
      backdrop-filter: blur(10px);
    }

    .viewer-arrow span {
      display: block;

    .transition {
      position: fixed;

        linear-gradient(
          105deg,
          transparent 0 34%,

        );

    .transition.active {
      animation: transitionSweep .72s cubic-bezier(.7,0,.3,1) both;

    .transition span {
      padding: 13px 21px;
      color: var(--gold-light);
      background: rgba(41,29,16,.5);

      border-radius: 50%;

    }

    @keyframes transitionSweep {
      0% {
        opacity: 0;
        transform: translateX(-115%);
      }

      24% {
        opacity: 1;
      }

      72% {
        opacity: 1;
      }

      100% {

<body>
    <div id="world" class="world"></div>

    <nav id="side-nav" class="side-nav" aria-label="展厅导航"></nav>

    <aside id="editor" class="editor">

      </button>

      <h2>展厅编辑</h2>

      <p class="editor-intro">
        每个展厅可以上传多张图片或多个视频。图片支持局部热点说明，
        拖动编辑区中的金色圆点即可调整位置。

      <div class="editor-actions">

      <div class="editor-tip">
        图片不会被压缩。视频会直接上传至 Supabase Storage。
        任何设备访问同一个 GitHub Pages 地址时，都能读取云端内容。

    <section id="viewer" class="viewer">
      <button id="viewer-close" class="viewer-close" aria-label="关闭大图">

      </button>

      </div>

    </div>

    <audio
      id="ambient-audio"
      loop
      preload="none"
      crossorigin="anonymous"
      src="https://cdn.pixabay.com/audio/2022/03/15/audio_731c6e0f4c.mp3">
    </audio>
  </main>

  <script>
    const SUPABASE_URL =
      "https://htdkyyggwsnsigrpclae.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_Ui-qf5Rom0fohPJUzBOMug_Fe8f_Nrc";

    const BUCKET = "111";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    let halls = [];
    let currentHallIndex = 0;
    let pendingFiles = new Map();
    let viewerMediaList = [];
    let viewerIndex = 0;
    let lastWheel = 0;

    const world = document.querySelector("#world");
    const sideNav = document.querySelector("#side-nav");
    const detailPanel = document.querySelector("#detail-panel");
    const editor = document.querySelector("#editor");
    const mediaEditors = document.querySelector("#media-editors");
    const viewer = document.querySelector("#viewer");
    const viewerContent = document.querySelector("#viewer-content");
    const audio = document.querySelector("#ambient-audio");

    window.addEventListener("DOMContentLoaded", init);

    async function init() {
      bindEvents();

      try {
        await loadData();

        renderWorld();
        renderNavigation();
        renderEditor();
        updateHallPosition();
      } catch (error) {
        console.error(error);
        showLoadError(error);
      }
    }

    async function loadData() {
      const hallResult = await supabaseClient
        .from("museum_halls")
        .select("*")
        .order("sort_order", { ascending: true });

      if (hallResult.error) {
        throw hallResult.error;
      }

      const mediaResult = await supabaseClient
        .from("museum_media")
        .select("*")
        .order("sort_order", { ascending: true });

      if (mediaResult.error) {
        throw mediaResult.error;
      }

      halls = hallResult.data.map(hall => ({
        ...hall,
        media: mediaResult.data.filter(
          media => media.hall_id === hall.id
        )
      }));

      if (!halls.length) {
        throw new Error("museum_halls 表中没有展厅数据");
      }
    }

    function showLoadError(error) {
      document.querySelector("#world").innerHTML = `
        <section class="hall" style="
          display:grid;
          place-items:center;
          padding:30px;
          text-align:center;
        ">
          <div>
            <h1 style="font-size:32px;">展厅暂时无法打开</h1>
            <p style="color:rgba(255,255,255,.7);line-height:2;">
              请检查 Supabase URL、Publishable Key、数据库表和 RLS 权限。
            </p>
            <pre style="
              max-width:800px;
              overflow:auto;
              padding:15px;
              color:#f0d7a0;
              background:rgba(0,0,0,.32);
              text-align:left;
              white-space:pre-wrap;
            ">${escapeHtml(error.message || String(error))}</pre>
          </div>
        </section>
      `;
    }

    function renderWorld() {
      world.innerHTML = "";

      halls.forEach((hall, hallIndex) => {
        const section = document.createElement("section");

        section.className = "hall";
        section.dataset.dynasty = hall.id;

        section.innerHTML = `
          <header class="topbar">
            <div class="museum-title">
              <span class="seal">华</span>
              <span>华夏文明 · 秦汉至明清</span>
            </div>

            <div class="counter">
              ${String(hallIndex + 1).padStart(2, "0")} /
              ${String(halls.length).padStart(2, "0")}
            </div>
          </header>

          <div class="hall-copy">
            <span class="hall-index">
              HALL ${String(hallIndex + 1).padStart(2, "0")}
              · ${escapeHtml(hall.dynasty)}
            </span>

            <h1>${escapeHtml(hall.dynasty)}</h1>
            <h2>${escapeHtml(hall.title || "")}</h2>
            <p>${escapeHtml(hall.description || "")}</p>
            <div class="gold-line"></div>
          </div>

          <div class="artifact-zone">
            <div class="artifact-glow"></div>

            <div class="artifact-stage">
              <div class="artifact-frame">
                <div class="media-box">
                  <div class="media-tools">
                    <button
                      class="tool fullscreen-button"
                      title="打开大图"
                    >⛶</button>
                  </div>

                  <div class="media-mount"></div>
                </div>

                <div class="artifact-caption">
                  <div>
                    <strong class="artifact-title"></strong>
                    <small>
                      ${escapeHtml(hall.dynasty)} · 线上重点展品
                    </small>
                  </div>

                  <span class="media-count"></span>
                </div>

                <div class="media-strip"></div>
              </div>
            </div>
          </div>

          <div class="hall-help">
            鼠标移动探索空间 · 滚轮切换朝代 · 双击展品查看大图
          </div>
        `;

        world.appendChild(section);
        renderHallMedia(section, hall);
      });
    }

    function renderHallMedia(section, hall) {
      const mount = section.querySelector(".media-mount");
      const title = section.querySelector(".artifact-title");
      const count = section.querySelector(".media-count");
      const strip = section.querySelector(".media-strip");
      const fullscreenButton =
        section.querySelector(".fullscreen-button");

      let activeIndex = 0;

      if (!hall.media.length) {
        mount.innerHTML = `
          <div style="
            display:grid;
            place-items:center;
            min-height:360px;
            color:rgba(255,255,255,.55);
            font-size:13px;
          ">
            请在编辑面板上传展品
          </div>
        `;

        count.textContent = "暂无媒体";
        return;
      }

      function renderActiveMedia() {
        const media = hall.media[activeIndex];

        mount.innerHTML = "";

        const stage = document.createElement("div");
        stage.className = "media-stage";

        const element = createMediaElement(media, false, hall.media);

        stage.appendChild(element);

        if (media.media_type === "image") {
          renderHotspots(stage, media, false);
        }

        mount.appendChild(stage);

        title.textContent =
          media.title || `${hall.dynasty}重点展品`;

        count.textContent =
          `${activeIndex + 1} / ${hall.media.length}`;

        fullscreenButton.onclick = () => {
          openViewer(media, hall.media);
        };
      }

      strip.innerHTML = "";

      hall.media.forEach((media, index) => {
        const button = document.createElement("button");

        button.className = "media-thumb";
        button.title = media.title || `媒体 ${index + 1}`;

        const preview =
          media.media_type === "video"
            ? document.createElement("video")
            : document.createElement("img");

        preview.src = media.media_url;

        if (media.media_type === "video") {
          preview.muted = true;
          preview.preload = "metadata";
        }

        const badge = document.createElement("span");
        badge.textContent =
          media.media_type === "video" ? "视频" : `${index + 1}`;

        button.append(preview, badge);

        button.addEventListener("click", () => {
          activeIndex = index;

          strip
            .querySelectorAll(".media-thumb")
            .forEach((item, itemIndex) => {
              item.classList.toggle(
                "active",
                itemIndex === activeIndex
              );
            });

          renderActiveMedia();
        });

        strip.appendChild(button);
      });

      strip.querySelector(".media-thumb")?.classList.add("active");
      renderActiveMedia();
    }

    function createMediaElement(media, viewerMode, mediaList) {
      if (media.media_type === "video") {
        const video = document.createElement("video");

        video.src = media.media_url;
        video.controls = true;
        video.preload = "metadata";
        video.playsInline = true;
        video.muted = false;

        video.setAttribute("playsinline", "");
        video.setAttribute("webkit-playsinline", "");

        video.addEventListener("error", () => {
          console.error("视频播放失败", {
            url: media.media_url,
            error: video.error
          });
        });

        video.addEventListener("dblclick", event => {
          event.preventDefault();
          openViewer(media, mediaList || [media]);
        });

        return video;
      }

      const image = document.createElement("img");

      image.src = media.media_url;
      image.alt = media.title || "展品图片";
      image.draggable = false;

      image.addEventListener("dblclick", event => {
        event.preventDefault();
        openViewer(media, mediaList || [media]);
      });

      if (!viewerMode) {
        image.addEventListener("click", event => {
          selectNearestHotspot(event, image, media);
        });
      }

      return image;
    }

    function renderHotspots(container, media, viewerMode) {
      if (!Array.isArray(media.hotspots)) {
        return;
      }

      media.hotspots.forEach(hotspot => {
        const button = document.createElement("button");

        button.className = viewerMode
          ? "viewer-hotspot"
          : "hotspot";

        button.style.left = `${Number(hotspot.x) || 50}%`;
        button.style.top = `${Number(hotspot.y) || 50}%`;
        button.textContent = "+";
        button.title = hotspot.title || "局部说明";

        button.addEventListener("click", event => {
  event.preventDefault();
  event.stopPropagation();

  showDetail(media, hotspot);

  button.classList.add("selected");

  const hotspotSelector = viewerMode
    ? ".viewer-hotspot"
    : ".hotspot";

  container
    .querySelectorAll(hotspotSelector)
    .forEach(otherButton => {
      if (otherButton !== button) {
        otherButton.classList.remove("selected");
      }
    });
});

        container.appendChild(button);
      });
    }

    function selectNearestHotspot(event, image, media) {
      if (!Array.isArray(media.hotspots) || !media.hotspots.length) {
        return;
      }

      const rect = image.getBoundingClientRect();

      const x =
        ((event.clientX - rect.left) / rect.width) * 100;

      const y =
        ((event.clientY - rect.top) / rect.height) * 100;

      let nearest = null;
      let nearestDistance = Infinity;

      media.hotspots.forEach(hotspot => {
        const distance = Math.sqrt(
          Math.pow(Number(hotspot.x) - x, 2) +
          Math.pow(Number(hotspot.y) - y, 2)
        );

        if (distance < nearestDistance) {
          nearest = hotspot;
          nearestDistance = distance;
        }
      });

      if (nearest && nearestDistance < 17) {
        showDetail(media, nearest);
      }
    }

    function showDetail(media, hotspot) {
  const mediaTitle = media.title || "局部说明";
  const hotspotTitle = hotspot.title || "未命名区域";
  const hotspotText = hotspot.text || "暂无说明";

  /*
   * 大图查看器打开时，更新大图右侧说明。
   */
  if (viewer.classList.contains("show")) {
    const viewerDetail = document.querySelector("#viewer-detail");
    const viewerLabel = viewerDetail.querySelector("small");
    const viewerTitle = document.querySelector("#viewer-title");
    const viewerText = document.querySelector("#viewer-text");

    viewerLabel.textContent = mediaTitle;
    viewerTitle.textContent = hotspotTitle;
    viewerText.textContent = hotspotText;

    viewerDetail.classList.add("has-hotspot");

    return;
  }

  /*
   * 普通展厅状态，更新底部说明面板。
   */
  document.querySelector("#detail-label").textContent =
    mediaTitle;

  document.querySelector("#detail-title").textContent =
    hotspotTitle;

  document.querySelector("#detail-text").textContent =
    hotspotText;

  detailPanel.classList.add("show");
}
    function renderNavigation() {
      sideNav.innerHTML = "";

      halls.forEach((hall, index) => {
        const button = document.createElement("button");

        button.className = "nav-dot";
        button.innerHTML = `
          <span>${escapeHtml(hall.dynasty)}</span>
        `;

        button.addEventListener("click", () => {
          goToHall(index);
        });

        sideNav.appendChild(button);
      });

      updateHallPosition();
    }

    function updateHallPosition() {
      world.style.transform =
        `translateY(-${currentHallIndex * 100}vh)`;

      sideNav
        .querySelectorAll(".nav-dot")
        .forEach((button, index) => {
          button.classList.toggle(
            "active",
            index === currentHallIndex
          );
        });
    }

    function goToHall(index) {
      if (
        index < 0 ||
        index >= halls.length ||
        index === currentHallIndex
      ) {
        return;
      }

      const oldHall = halls[currentHallIndex];
      const newHall = halls[index];

      currentHallIndex = index;

      playTransition(
        oldHall.dynasty,
        newHall.dynasty
      );

      updateHallPosition();
      renderEditor();
      closeDetail();
    }

    function playTransition(oldName, newName) {
      const transition = document.querySelector("#transition");
      const text = document.querySelector("#transition-text");

      text.textContent = `${oldName}  →  ${newName}`;
      transition.classList.remove("active");

      void transition.offsetWidth;

      transition.classList.add("active");
    }

    function bindEvents() {
      window.addEventListener("wheel", event => {
        if (viewer.classList.contains("show")) {
          return;
        }

        const now = Date.now();

        if (now - lastWheel < 700) {
          return;
        }

        lastWheel = now;

        if (event.deltaY > 0) {
          goToHall(
            Math.min(
              currentHallIndex + 1,
              halls.length - 1
            )
          );
        } else {
          goToHall(
            Math.max(currentHallIndex - 1, 0)
          );
        }
      }, { passive: true });

      window.addEventListener("keydown", event => {
        if (viewer.classList.contains("show")) {
          if (event.key === "ArrowLeft") {
            event.preventDefault();
            showPreviousMedia();
            return;
          }

          if (event.key === "ArrowRight") {
            event.preventDefault();
            showNextMedia();
            return;
          }

          if (event.key === "Escape") {
            closeViewer();
            return;
          }
        }

        if (event.key === "ArrowDown") {
          goToHall(
            Math.min(
              currentHallIndex + 1,
              halls.length - 1
            )
          );
        }

        if (event.key === "ArrowUp") {
          goToHall(
            Math.max(currentHallIndex - 1, 0)
          );
        }

        if (event.key === "Escape") {
          closeViewer();
          closeDetail();
          editor.classList.remove("open");
        }
      });

      window.addEventListener("pointermove", event => {
        const hall =
          document.querySelectorAll(".hall")[currentHallIndex];

        if (!hall) {
          return;
        }

        const x =
          (event.clientX / innerWidth - .5) * 12;

        const y =
          (event.clientY / innerHeight - .5) * 8;

        hall.style.setProperty("--mx", `${x}px`);
        hall.style.setProperty("--my", `${y}px`);
      });

      document.querySelector("#close-detail")
        .addEventListener("click", closeDetail);

      document.querySelector("#edit-toggle")
        .addEventListener("click", () => {
          editor.classList.add("open");
        });

      document.querySelector("#editor-close")
        .addEventListener("click", () => {
          editor.classList.remove("open");
        });

      document.querySelector("#add-media")
        .addEventListener("click", addMediaFiles);

      document.querySelector("#save")
        .addEventListener("click", saveCurrentHall);

      document.querySelector("#viewer-close")
        .addEventListener("click", closeViewer);

      document.querySelector("#viewer-prev")
        .addEventListener("click", event => {
          event.stopPropagation();
          showPreviousMedia();
        });

      document.querySelector("#viewer-next")
        .addEventListener("click", event => {
          event.stopPropagation();
          showNextMedia();
        });

      document.querySelector("#viewer-fullscreen")
        .addEventListener("click", async () => {
          if (!document.fullscreenElement) {
            await viewer.requestFullscreen?.();
          } else {
            await document.exitFullscreen?.();
          }
        });

      viewerContent.addEventListener("click", event => {
        if (event.target.closest(".viewer-hotspot")) {
          return;
        }

        const rect = viewerContent.getBoundingClientRect();
        const relativeX =
          (event.clientX - rect.left) / rect.width;

        if (relativeX < .2) {
          showPreviousMedia();
        }

        if (relativeX > .8) {
          showNextMedia();
        }
      });

      document.querySelector("#music-toggle")
        .addEventListener("click", toggleMusic);
    }

    function openViewer(media, mediaList) {
      viewerMediaList = mediaList?.length
        ? mediaList
        : [media];

      viewerIndex = viewerMediaList.findIndex(
        item => item.id === media.id
      );

      if (viewerIndex < 0) {
        viewerIndex = 0;
      }

      renderViewerMedia();
      viewer.classList.add("show");
    }

    function renderViewerMedia() {
      const media = viewerMediaList[viewerIndex];

      if (!media) {
        return;
      }

      viewerContent.innerHTML = "";

      const stage = document.createElement("div");
      stage.className = "viewer-media-stage";

      const element = createMediaElement(
        media,
        true,
        viewerMediaList
      );

      stage.appendChild(element);

      if (media.media_type === "image") {
        renderHotspots(stage, media, true);
      }

      viewerContent.appendChild(stage);

      document.querySelector("#viewer-counter").textContent =
        `${viewerIndex + 1} / ${viewerMediaList.length}`;

      document.querySelector("#viewer-title").textContent =
        media.title || "展品说明";

      document.querySelector("#viewer-text").textContent =
        media.description ||
        "点击图片上的金色热点查看局部说明。";
        document
  .querySelector("#viewer-detail")
  .classList.remove("has-hotspot");
    }

    function showPreviousMedia() {
      if (viewerMediaList.length < 2) {
        return;
      }

      viewerIndex =
        (viewerIndex - 1 + viewerMediaList.length) %
        viewerMediaList.length;

      renderViewerMedia();
    }

    function showNextMedia() {
      if (viewerMediaList.length < 2) {
        return;
      }

      viewerIndex =
        (viewerIndex + 1) %
        viewerMediaList.length;

      renderViewerMedia();
    }

    function closeViewer() {
      viewer.classList.remove("show");
      viewerContent.innerHTML = "";
      viewerMediaList = [];
      viewerIndex = 0;
    }

    function closeDetail() {
      detailPanel.classList.remove("show");
    }

    function renderEditor() {
      const hall = halls[currentHallIndex];

      document.querySelector("#hall-title").value =
        hall.title || "";

      document.querySelector("#hall-subtitle").value =
        hall.subtitle || "";

      document.querySelector("#hall-description").value =
        hall.description || "";

      mediaEditors.innerHTML = "";

      hall.media.forEach(media => {
        mediaEditors.appendChild(
          createMediaEditor(media)
        );
      });

      renderPendingFiles();
    }

    function createMediaEditor(media) {
      const wrapper = document.createElement("div");

      wrapper.className = "media-editor";
      wrapper.dataset.mediaId = media.id;

      wrapper.innerHTML = `
        <div class="media-head">
          <strong>
            ${media.media_type === "video" ? "视频" : "图片"}
            · ${escapeHtml(media.title || "未命名")}
          </strong>

          <button class="small-button danger remove-media">
            删除
          </button>
        </div>

        <div class="editor-preview"></div>

        <div class="field">
          <label>展品名称</label>
          <input class="media-title">
        </div>

        <div class="field">
          <label>展品说明</label>
          <textarea class="media-description"></textarea>
        </div>

        <label class="small-button">
          更换文件
          <input
            class="replace-file"
            type="file"
            accept="image/*,video/*"
            hidden
          >
        </label>

        <div class="hotspot-list"></div>

        <button class="small-button add-hotspot">
          新增局部说明
        </button>
      `;

      wrapper.querySelector(".media-title").value =
        media.title || "";

      wrapper.querySelector(".media-description").value =
        media.description || "";

      const preview = wrapper.querySelector(".editor-preview");

      if (media.media_type === "video") {
        const video = document.createElement("video");

        video.src = media.media_url;
        video.controls = true;
        video.preload = "metadata";
        video.playsInline = true;

        preview.appendChild(video);
      } else {
        const stage = document.createElement("div");

        stage.className = "edit-media-stage";

        const image = document.createElement("img");

        image.src = media.media_url;
        image.alt = media.title || "图片";
        image.draggable = false;

        const layer = document.createElement("div");

        layer.className = "edit-hotspot-layer";

        stage.append(image, layer);
        preview.appendChild(stage);

        renderEditableHotspots(media, layer);

        image.addEventListener("click", event => {
          addHotspotAtPoint(
            event,
            image,
            media,
            layer
          );
        });
      }

      renderHotspotRows(wrapper, media);

      wrapper.querySelector(".remove-media")
        .addEventListener("click", async () => {
          if (!confirm("确定删除这件媒体吗？")) {
            return;
          }

          const result = await supabaseClient
            .from("museum_media")
            .delete()
            .eq("id", media.id);

          if (result.error) {
            alert(result.error.message);
            return;
          }

          await loadData();
          renderWorld();
          renderEditor();
        });

      wrapper.querySelector(".replace-file")
        .addEventListener("change", event => {
          const file = event.target.files[0];

          if (!file) {
            return;
          }

          pendingFiles.set(media.id, file);

          const previewUrl = URL.createObjectURL(file);
          preview.innerHTML = "";

          if (file.type.startsWith("video/")) {
            const video = document.createElement("video");

            video.src = previewUrl;
            video.controls = true;
            video.preload = "metadata";
            video.playsInline = true;

            preview.appendChild(video);
          } else {
            const stage = document.createElement("div");

            stage.className = "edit-media-stage";

            const image = document.createElement("img");

            image.src = previewUrl;
            image.alt = "待上传图片";

            stage.appendChild(image);
            preview.appendChild(stage);
          }
        });

      wrapper.querySelector(".add-hotspot")
        .addEventListener("click", () => {
          if (media.media_type !== "image") {
            alert("视频不设置图片热点。");
            return;
          }

          const title = prompt(
            "请输入局部标题：",
            "新的局部说明"
          );

          if (!title) {
            return;
          }

          const text = prompt(
            "请输入局部说明：",
            "请填写这部分内容。"
          );

          if (text === null) {
            return;
          }

          media.hotspots = Array.isArray(media.hotspots)
            ? media.hotspots
            : [];

          media.hotspots.push({
            x: 50,
            y: 50,
            title,
            text
          });

          renderEditor();
        });

      return wrapper;
    }

    function renderHotspotRows(wrapper, media) {
      const list = wrapper.querySelector(".hotspot-list");

      list.innerHTML = "";

      (media.hotspots || []).forEach((hotspot, index) => {
        const row = document.createElement("div");

        row.className = "hotspot-row";

        const titleInput = document.createElement("input");
        titleInput.className = "hotspot-title";
        titleInput.value = hotspot.title || "";
        titleInput.placeholder = "局部标题";

        const coordinateRow = document.createElement("div");
        coordinateRow.className = "coordinate-row";

        const xInput = document.createElement("input");
        xInput.className = "hotspot-x";
        xInput.type = "number";
        xInput.min = "0";
        xInput.max = "100";
        xInput.value = hotspot.x ?? 50;

        const yInput = document.createElement("input");
        yInput.className = "hotspot-y";
        yInput.type = "number";
        yInput.min = "0";
        yInput.max = "100";
        yInput.value = hotspot.y ?? 50;

        coordinateRow.append(xInput, yInput);

        const textInput = document.createElement("textarea");
        textInput.className = "hotspot-text";
        textInput.value = hotspot.text || "";
        textInput.placeholder = "局部说明";

        const deleteButton = document.createElement("button");
        deleteButton.className =
          "small-button danger";
        deleteButton.textContent = "删除局部说明";

        function updateLocalHotspot() {
          hotspot.title = titleInput.value;
          hotspot.x = clamp(Number(xInput.value), 0, 100);
          hotspot.y = clamp(Number(yInput.value), 0, 100);
          hotspot.text = textInput.value;

          const stage =
            wrapper.querySelector(".edit-hotspot-layer");

          if (stage) {
            renderEditableHotspots(media, stage);
          }
        }

        titleInput.addEventListener("input", updateLocalHotspot);
        xInput.addEventListener("input", updateLocalHotspot);
        yInput.addEventListener("input", updateLocalHotspot);
        textInput.addEventListener("input", updateLocalHotspot);

        deleteButton.addEventListener("click", () => {
          media.hotspots.splice(index, 1);
          renderEditor();
        });

        row.append(
          titleInput,
          coordinateRow,
          textInput,
          deleteButton
        );

        list.appendChild(row);
      });
    }

    function renderEditableHotspots(media, layer) {
      layer.innerHTML = "";

      (media.hotspots || []).forEach((hotspot, index) => {
        const button = document.createElement("button");

        button.className = "edit-hotspot";
        button.textContent = index + 1;
        button.title = "拖动调整位置";

        button.style.left = `${clamp(Number(hotspot.x), 0, 100)}%`;
        button.style.top = `${clamp(Number(hotspot.y), 0, 100)}%`;

        let dragging = false;

        button.addEventListener("pointerdown", event => {
          event.preventDefault();
          event.stopPropagation();

          dragging = true;
          button.setPointerCapture(event.pointerId);
        });

        button.addEventListener("pointermove", event => {
          if (!dragging) {
            return;
          }

          const rect = layer.getBoundingClientRect();

          hotspot.x = clamp(
            ((event.clientX - rect.left) / rect.width) * 100,
            0,
            100
          );

          hotspot.y = clamp(
            ((event.clientY - rect.top) / rect.height) * 100,
            0,
            100
          );

          hotspot.x = Number(hotspot.x.toFixed(2));
          hotspot.y = Number(hotspot.y.toFixed(2));

          button.style.left = `${hotspot.x}%`;
          button.style.top = `${hotspot.y}%`;

          const row = layer
            .closest(".media-editor")
            ?.querySelectorAll(".hotspot-row")[index];

          if (row) {
            row.querySelector(".hotspot-x").value =
              hotspot.x;

            row.querySelector(".hotspot-y").value =
              hotspot.y;
          }
        });

        button.addEventListener("pointerup", event => {
          dragging = false;

          if (button.hasPointerCapture(event.pointerId)) {
            button.releasePointerCapture(event.pointerId);
          }
        });

        layer.appendChild(button);
      });
    }

    function addHotspotAtPoint(event, image, media, layer) {
      if (event.target.closest(".edit-hotspot")) {
        return;
      }

      const rect = image.getBoundingClientRect();

      const x = clamp(
        ((event.clientX - rect.left) / rect.width) * 100,
        0,
        100
      );

      const y = clamp(
        ((event.clientY - rect.top) / rect.height) * 100,
        0,
        100
      );

      const title = prompt(
        "请输入局部标题：",
        "新的局部说明"
      );

      if (!title) {
        return;
      }

      const text = prompt(
        "请输入局部说明：",
        "请填写这部分内容。"
      );

      if (text === null) {
        return;
      }

      media.hotspots = Array.isArray(media.hotspots)
        ? media.hotspots
        : [];

      media.hotspots.push({
        x: Number(x.toFixed(2)),
        y: Number(y.toFixed(2)),
        title,
        text
      });

      renderEditor();
    }

    function addMediaFiles() {
      const input = document.createElement("input");

      input.type = "file";
      input.multiple = true;
      input.accept =
        "image/jpeg,image/png,image/webp,video/mp4,video/webm,video/ogg";

      input.addEventListener("change", event => {
        const files = Array.from(event.target.files);

        files.forEach(file => {
          pendingFiles.set(
            `new-${cryptoRandom()}`,
            file
          );
        });

        renderPendingFiles();
      });

      input.click();
    }

    function renderPendingFiles() {
      const keys = [...pendingFiles.keys()]
        .filter(key => key.startsWith("new-"));

      let pendingBox = document.querySelector(
        "#pending-files"
      );

      if (!pendingBox) {
        pendingBox = document.createElement("div");
        pendingBox.id = "pending-files";
        pendingBox.className = "media-editor";
        mediaEditors.appendChild(pendingBox);
      }

      if (!keys.length) {
        pendingBox.innerHTML = "";
        return;
      }

      pendingBox.innerHTML = `
        <div class="media-head">
          <strong>待上传媒体</strong>
          <span style="font-size:11px;color:#81786d;">
            ${keys.length} 个文件
          </span>
        </div>

        <p style="
          margin:0;
          color:#81786d;
          font-size:11px;
          line-height:1.8;
        ">
          点击“保存到云端”后，这些图片或视频会上传到 Supabase。
        </p>
      `;
    }

    async function saveCurrentHall() {
      const hall = halls[currentHallIndex];

      const hallUpdate = {
        title: document.querySelector("#hall-title").value.trim(),
        subtitle: document.querySelector("#hall-subtitle").value.trim(),
        description: document
          .querySelector("#hall-description")
          .value
          .trim(),
        updated_at: new Date().toISOString()
      };

      const hallResult = await supabaseClient
        .from("museum_halls")
        .update(hallUpdate)
        .eq("id", hall.id);

      if (hallResult.error) {
        alert(`展厅保存失败：${hallResult.error.message}`);
        return;
      }

      const editorItems = [
        ...mediaEditors.querySelectorAll(
          ".media-editor[data-media-id]"
        )
      ];

      for (const item of editorItems) {
        const mediaId = item.dataset.mediaId;
        const media = getMediaById(mediaId);

        if (!media) {
          continue;
        }

        const title = item
          .querySelector(".media-title")
          .value
          .trim();

        const description = item
          .querySelector(".media-description")
          .value
          .trim();

        const metadataResult = await supabaseClient
          .from("museum_media")
          .update({
            title,
            description,
            hotspots: media.hotspots || []
          })
          .eq("id", mediaId);

        if (metadataResult.error) {
          alert(
            `媒体信息保存失败：${metadataResult.error.message}`
          );
          return;
        }

        const replacement = pendingFiles.get(mediaId);

        if (replacement) {
          const uploaded = await uploadFile(
            hall.id,
            mediaId,
            replacement
          );

          if (!uploaded) {
            return;
          }

          const replacementResult = await supabaseClient
            .from("museum_media")
            .update({
              media_type: getMediaType(replacement),
              media_url: uploaded.url,
              storage_path: uploaded.path
            })
            .eq("id", mediaId);

          if (replacementResult.error) {
            alert(
              `替换媒体失败：${replacementResult.error.message}`
            );
            return;
          }

          pendingFiles.delete(mediaId);
        }
      }

      const newEntries = [...pendingFiles.entries()]
        .filter(([key]) => key.startsWith("new-"));

      let nextOrder = hall.media.length;

      for (const [pendingKey, file] of newEntries) {
        const mediaId = cryptoRandom();

        const uploaded = await uploadFile(
          hall.id,
          mediaId,
          file
        );

        if (!uploaded) {
          return;
        }

        const insertResult = await supabaseClient
          .from("museum_media")
          .insert({
            id: mediaId,
            hall_id: hall.id,
            media_type: getMediaType(file),
            media_url: uploaded.url,
            storage_path: uploaded.path,
            title: file.name.replace(/\.[^/.]+$/, ""),
            description: "",
            sort_order: nextOrder,
            hotspots: []
          });

        if (insertResult.error) {
          alert(
            `媒体记录保存失败：${insertResult.error.message}`
          );
          return;
        }

        nextOrder += 1;
        pendingFiles.delete(pendingKey);
      }

      await loadData();

      renderWorld();
      renderNavigation();
      renderEditor();

      editor.classList.remove("open");

      alert("展厅和媒体已经保存到云端。");
    }

    async function uploadFile(hallId, mediaId, file) {
      const extension = getExtension(file.name);
      const path = `halls/${hallId}/${mediaId}.${extension}`;

      const uploadResult = await supabaseClient
        .storage
        .from(BUCKET)
        .upload(path, file, {
          upsert: true,
          contentType: file.type,
          cacheControl: "3600"
        });

      if (uploadResult.error) {
        alert(`文件上传失败：${uploadResult.error.message}`);
        return null;
      }

      const url =
        `${SUPABASE_URL}/storage/v1/object/public/` +
        `${BUCKET}/${path}`;

      return {
        path,
        url
      };
    }

    function getMediaType(file) {
      return file.type.startsWith("video/")
        ? "video"
        : "image";
    }

    function getExtension(name) {
      const parts = name.split(".");

      return parts.length > 1
        ? parts[parts.length - 1].toLowerCase()
        : "bin";
    }

    function getMediaById(id) {
      const hall = halls[currentHallIndex];

      return hall.media.find(media => media.id === id);
    }

    function toggleMusic() {
      const button = document.querySelector("#music-toggle");

      if (audio.paused) {
        audio.volume = .18;
        audio.play()
          .then(() => {
            button.classList.add("active");
            button.textContent = "♫ 环境音";
          })
          .catch(() => {
            alert("浏览器阻止了自动播放，请再次点击环境音按钮。");
          });
         
      } else {
        audio.pause();
        button.classList.remove("active");
        button.textContent = "♪ 环境音";
      }
    }
    
    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function cryptoRandom() {
      if (window.crypto?.randomUUID) {
        return window.crypto.randomUUID();
      }

      return `id-${Date.now()}-${Math.random()
        .toString(36)
        .slice(2)}`;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
